<title>Tap and Scrape Band</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Tap and Scrape Band</h1>
<p class="sub">Tap a dot to switch a step on or off. Tap an instrument to hear it.</p>
<canvas id="stage" width="900" height="400"></canvas>
<div class="controls">
<button id="start" type="button">Start</button>
<label for="tempo">Tempo <span id="bpmLabel">110</span> BPM</label>
<input id="tempo" type="range" min="60" max="180" value="110">
</div>
<p class="hint" id="hint">Press Start to wake the band. The row of lights at the bottom shows the current step.</p>
<script src="sound.js"></script>
<script src="band.js"></script>
</body>
</html>
